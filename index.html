<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Registry</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: "Inter", sans-serif;
  background: linear-gradient(135deg, #0f172a, #020617);
  color: #e2e8f0;
}

/* NAV */
header {
  position: sticky;
  top: 0;
  backdrop-filter: blur(12px);
  background: rgba(0,0,0,0.4);
  border-bottom: 1px solid rgba(255,255,255,0.08);
  z-index: 100;
}

.nav {
  max-width: 1200px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  padding: 18px 20px;
}

.logo { font-weight: 700; }

.links a {
  margin-left: 20px;
  color: #94a3b8;
  text-decoration: none;
}

.links a:hover { color: white; }

/* PAGES */
.page { display: none; }
.page.active { display: block; }

.container {
  max-width: 1100px;
  margin: 40px auto;
  padding: 20px;
}

.section {
  background: rgba(255,255,255,0.05);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 25px;
}

h2 { margin-top: 0; }

/* TABLE */
table { width: 100%; border-collapse: collapse; }
th, td { padding: 12px; }
th { color: #64748b; font-size: 0.8rem; }
tr:hover { background: rgba(255,255,255,0.05); }

/* BADGES */
.badge { padding: 4px 10px; border-radius: 999px; }
.high { background: rgba(34,197,94,0.2); color: #22c55e; }

/* BUTTON */
.btn {
  padding: 8px 14px;
  border-radius: 8px;
  background: #22c55e;
  color: black;
  font-weight: 600;
  cursor: pointer;
  border: none;
}

.btn:hover { opacity: 0.8; }

/* DISCORD LIST */
.user {
  padding: 12px;
  background: rgba(255,255,255,0.05);
  border-radius: 10px;
  margin-bottom: 10px;
}
</style>
</head>

<body>

<header>
  <div class="nav">
    <div class="logo">Product Registry</div>
    <div class="links">
      <a href="#" onclick="showPage('home')">Home</a>
      <a href="#" onclick="showPage('products')">Products</a>
      <a href="#" onclick="showPage('faq')">FAQ</a>
    </div>
  </div>
</header>

<!-- HOME -->
<div id="home" class="page active">
  <div class="container">
    <div class="section">
      <h2>Welcome</h2>
      <p>Modern product trust registry system.</p>
    </div>
  </div>
</div>

<!-- PRODUCTS -->
<div id="products" class="page">
  <div class="container">
    <div class="section">
      <h2>Trusted Products</h2>
      <table>
        <tr>
          <th>Name</th>
          <th>Score</th>
          <th>Platform</th>
          <th>UNC</th>
          <th>Buy</th>
        </tr>
        <tr>
          <td>Volt</td>
          <td><span class="badge high">95</span></td>
          <td>Windows</td>
          <td>97%</td>
          <td><button class="btn" onclick="showPage('buy')">Buy Now</button></td>
        </tr>
      </table>
    </div>
  </div>
</div>

<!-- BUY PAGE -->
<div id="buy" class="page">
  <div class="container">
    <div class="section">
      <h2>Official Resellers</h2>
      <div class="user">@volt_admin</div>
      <div class="user">@trusted_seller1</div>
      <div class="user">@securevolt</div>
      <div class="user">@voltmarket</div>
      <div class="user">@officialvolt</div>

      <br>
      <button class="btn" onclick="showPage('products')">Back</button>
    </div>
  </div>
</div>

<!-- FAQ -->
<div id="faq" class="page">
  <div class="container">
    <div class="section">
      <h2>FAQ</h2>
      <p>Coming soon.</p>
    </div>
  </div>
</div>

<script>
function showPage(pageId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(pageId).classList.add('active');
}
</script>

</body>
</html>
