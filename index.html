<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Registry</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: "Inter", sans-serif;
  background: linear-gradient(135deg, #0f172a, #020617);
  color: #e2e8f0;
}

header {
  position: sticky;
  top: 0;
  backdrop-filter: blur(12px);
  background: rgba(0,0,0,0.4);
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

.nav {
  max-width: 1200px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  padding: 18px 20px;
}

.links a {
  margin-left: 20px;
  color: #94a3b8;
  text-decoration: none;
  cursor: pointer;
}

.links a:hover { color: white; }

.container {
  max-width: 1100px;
  margin: 40px auto;
  padding: 20px;
}

.section {
  background: rgba(255,255,255,0.05);
  border-radius: 16px;
  padding: 20px;
}

/* TABLE */
table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}

th, td {
  padding: 14px;
  text-align: center;
}

th {
  color: #64748b;
  font-size: 0.75rem;
}

/* COLUMN WIDTHS */
th:nth-child(1), td:nth-child(1) { width: 16%; text-align: left; }
th:nth-child(2), td:nth-child(2) { width: 14%; }
th:nth-child(3), td:nth-child(3) { width: 12%; }
th:nth-child(4), td:nth-child(4) { width: 14%; }
th:nth-child(5), td:nth-child(5) { width: 18%; }
th:nth-child(6), td:nth-child(6) { width: 20%; text-align: left; }

tr:hover {
  background: rgba(255,255,255,0.05);
}

.badge {
  padding: 4px 10px;
  border-radius: 999px;
}

.high {
  background: rgba(34,197,94,0.2);
  color: #22c55e;
}
</style>
</head>

<body>

<header>
  <div class="nav">
    <div>Product Registry</div>
    <div class="links">
      <a>Products</a>
      <a>FAQ</a>
    </div>
  </div>
</header>

<div class="container">

  <div class="section">
    <h2>Trusted Executors</h2>

    <table>
      <tr>
        <th>Name</th>
        <th>Release Date</th>
        <th>Last Detection</th>
        <th>UNC</th>
        <th>Platform</th>
        <th>More Info</th>
      </tr>

      <tr>
        <td>Volt</td>
        <td>2025</td>
        <td>Jan 2026</td>
        <td><span class="badge high">97%</span></td>
        <td>Pc</td>
        <td>High UNC, actively maintained executor with frequent updates.</td>
      </tr>

    </table>

  </div>

</div>

</body>
</html>
